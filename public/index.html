<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ironcrown — Kingdom Strategy</title>
  <meta name="description" content="Build a kingdom on a hex world, research technologies, command divisions and fleets in on-map battles, explore ruins and conquer rival realms. Runs in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>" />
  <link rel="stylesheet" href="style.css?v=3.7.0" />
</head>
<body>
  <div id="boot-screen" role="status" aria-live="polite"><div class="boot-card"><div class="boot-crown">👑</div><h1>Ironcrown</h1><div class="boot-msg">Raising the realm…</div><div class="boot-bar"></div></div></div>
  <noscript><p style="color:#e8e2d0;text-align:center;padding:40px">Ironcrown needs JavaScript to run.</p></noscript>
  <div id="app">
    <!-- ===== Top HUD ===== -->
    <header id="hud">
      <div class="brand"><span class="crown">👑</span><div><b id="kingdom-name">Ironcrown</b><small id="hall-label">Main Hall 1</small></div></div>
      <div id="resources" class="resources"></div>
      <div class="hud-stats">
        <span class="chip" title="Season · day · year">📅 <b id="calendar">—</b></span>
        <span class="chip" title="Builders busy / total">🔨 <b id="builders">0/2</b></span>
        <span class="chip" title="Universities researching / total">🎓 <b id="research-chip">—</b></span>
        <span class="chip" title="Troops (all)">🛡️ <b id="army-cap">0</b></span>
        <span class="chip" title="Ships (all)">⚓ <b id="fleet-cap">0</b></span>
        <span class="chip" title="Total power">⚡ <b id="power">0</b></span>
        <span class="chip" id="shield-chip" hidden title="Peace shield active">🕊️ <b id="shield-time"></b></span>
        <span class="chip" id="fps-chip" hidden title="Frames per second (Settings → Show frame rate)">🎞️ <b id="fps-label">60</b></span>
        <span class="chip sync" id="sync" title="Save status">💾 <b id="sync-label">local</b></span>
        <button class="icon-btn" data-action="help" title="Help (H)">?</button>
        <button class="icon-btn" data-action="settings" title="Settings">⚙️</button>
        <button class="icon-btn" data-action="menu" title="Menu">☰</button>
      </div>
    </header>

    <main id="main">
      <!-- ===== Map stage ===== -->
      <section id="stage-wrap">
        <div id="alerts"></div>
        <div id="placing-hint" hidden></div>
        <canvas id="stage" aria-label="Game map"></canvas>
        <div class="speed-ctl" role="group" aria-label="Game speed">
          <button data-speed="0" title="Pause (P)">⏸</button>
          <button data-speed="1" class="on" title="Normal speed">1×</button>
          <button data-speed="2" title="Double speed">2×</button>
          <button data-speed="4" title="Quadruple speed">4×</button>
        </div>
        <div class="zoom-ctl">
          <button data-action="zoom-in" title="Zoom in (+)">+</button>
          <button data-action="zoom-out" title="Zoom out (−)">−</button>
          <button data-action="zoom-home" title="Recenter (Space)">🏠</button>
        </div>
        <canvas id="minimap" hidden title="Minimap — click to jump"></canvas>
        <div id="version" title="Game version"></div>
        <div id="battle-hud" hidden></div>
        <div id="tooltip" hidden></div>
      </section>

      <!-- ===== Side panel ===== -->
      <aside id="panel">
        <nav class="tabs" role="tablist">
          <button data-tab="info" class="active" title="Build (1)"><em>🏗️</em><span>Build</span></button>
          <button data-tab="map" title="Map (2)"><em>🧭</em><span>Map</span></button>
          <button data-tab="research" title="Research (3)"><em>🎓</em><span>Research</span></button>
          <button data-tab="army" title="Army (4)"><em>⚔️</em><span>Army</span></button>
          <button data-tab="navy" title="Navy (5)"><em>⚓</em><span>Navy</span></button>
          <button data-tab="generals" title="Generals (6)"><em>🎖️</em><span>Generals</span></button>
          <button data-tab="shop" title="Shop (7)"><em>🎁</em><span>Shop</span></button>
          <button data-tab="alliance" title="Alliance (8)"><em>🤝</em><span>Alliance</span></button>
          <button data-tab="log" title="Log (9)"><em>📜</em><span>Log</span><i id="log-dot" hidden></i></button>
        </nav>
        <div id="panel-body"></div>
      </aside>
    </main>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>

  <div id="toasts"></div>

  <!-- Game scripts (classic scripts sharing one global scope; order matters) -->
  <script src="js/data.js?v=3.7.0"></script>
  <script src="js/util.js?v=3.7.0"></script>
  <script src="js/state.js?v=3.7.0"></script>
  <script src="js/economy.js?v=3.7.0"></script>
  <script src="js/military.js?v=3.7.0"></script>
  <script src="js/research.js?v=3.7.0"></script>
  <script src="js/world.js?v=3.7.0"></script>
  <script src="js/sim.js?v=3.7.0"></script>
  <script src="js/alliances.js?v=3.7.0"></script>
  <script src="js/battle.js?v=3.7.0"></script>
  <script src="js/render-common.js?v=3.7.0"></script>
  <script src="js/gfx.js?v=3.7.0"></script>
  <script src="js/render-city.js?v=3.7.0"></script>
  <script src="js/render-world.js?v=3.7.0"></script>
  <script src="js/help.js?v=3.7.0"></script>
  <script src="js/ui-panels.js?v=3.7.0"></script>
  <script src="js/ui-actions.js?v=3.7.0"></script>
  <script src="js/main.js?v=3.7.0"></script>
</body>
</html>
